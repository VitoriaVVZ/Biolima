<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Tabelas Mescladas</title>
     <link rel="stylesheet" href="./exercicio.css">
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="4">Festival de Cinema 2026</th>
            </tr>
            <tr>
                <th>Categoria</th>
                <th>Filme</th>
                <th>Horário</th>
                <th>Sala</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Ação</td>
                <td>Vingadores</td>
                <td>18:00</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Batman</td>
                <td>20:30</td>
                <td>2</td>
            </tr>

            <tr>
                <td rowspan="2">Animação</td>
                <td>Toy Story</td>
                <td>16:00</td>
                <td>3</td>
            </tr>

             <tr>
                <td>Frozen</td>
                <td>17:30</td>
                <td>4</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
